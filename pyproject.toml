[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "immigration-microsimulation"
version = "2.1.0"
description = "A petitioner-level microsimulation of United States employment-based immigration that quantifies how the 7% per-country cap redistributes wait times and child age-out risk across nationalities and EB preference categories."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Adhithiya Narayanan Balamurugan", email = "adhithiya.balamurugan@gmail.com" },
]
keywords = [
  "employment-based-immigration", "per-country-cap", "child-age-out", "microsimulation",
]

dependencies = [
  "numpy==2.2.6",
  "pandas==2.3.3",
  "matplotlib==3.10.7",
  "seaborn==0.13.2",
  "scipy==1.15.3",
]

[project.urls]
Repository = "https://github.com/ANB-007/immigration-microsimulation"
Issues = "https://github.com/ANB-007/immigration-microsimulation/issues"
"Previous release" = "https://doi.org/10.5281/zenodo.21465739"

[tool.hatch.build.targets.wheel]
packages = ["simulation"]

# Keep model inputs at the same relative location in an installed model.
[tool.hatch.build.targets.wheel.force-include]
"data/petitions" = "data/petitions"
"data/demographics/spouse_presence_empirical_distributions.json" = "data/demographics/spouse_presence_empirical_distributions.json"
"data/demographics/children_count_empirical_distributions_married.json" = "data/demographics/children_count_empirical_distributions_married.json"
"data/demographics/principal_age_empirical_distributions.json" = "data/demographics/principal_age_empirical_distributions.json"
"data/demographics/child_entry_age_empirical_distributions.json" = "data/demographics/child_entry_age_empirical_distributions.json"
